<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>育児の記録</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="育児">
<meta name="theme-color" content="#FFF7EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1D2B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7EF; --card: #FFFFFF; --ink: #4A3F3A; --sub: #9A8A82; --line: #F1E6DC; --shadow: 0 4px 14px rgba(196,150,120,.14);
    --milk: #FF8E8E; --milk-bg: #FFECEA; --milk-ink: #C2525A;
    --dia: #F2B632; --dia-bg: #FFF4D6; --dia-ink: #9A6A00; --poo: #B07A4A;
    --room: #4FBF95; --room-bg: #E2F6EE; --room-ink: #2C8A66;
    --sky: #5AA9E6; --sky-bg: #E3F1FC; --sky-ink: #2E6FA8;
    --wt: #9B83E8; --wt-bg: #EFEAFF; --wt-ink: #6A50C4;
    --sum: #FFB86B; --sum-bg: #FFF0DF; --sum-ink: #B86A12;
    --warn: #E5544B; --warn-bg: #FFE6E3; --ok-bg: #E2F6EE; --ok: #2C8A66;
    --temp: #FF8A5C; --hum: #5AA9E6; --band: rgba(79,191,149,.13);
    --fab: #E85D6C; --on-fab: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1D2B; --card: #262938; --ink: #F1EAE4; --sub: #A69C98; --line: #34384A; --shadow: 0 4px 14px rgba(0,0,0,.3);
      --milk: #FF9D9D; --milk-bg: #3D2A33; --milk-ink: #FFB3B3;
      --dia: #F5C452; --dia-bg: #3B3424; --dia-ink: #F5D27E; --poo: #D9A27A;
      --room: #5ED1A6; --room-bg: #213A35; --room-ink: #7FE0BA;
      --sky: #7BBDF0; --sky-bg: #22334A; --sky-ink: #9CCDF5;
      --wt: #B4A0F5; --wt-bg: #302B4A; --wt-ink: #C9B9FF;
      --sum: #FFC27E; --sum-bg: #3B2F22; --sum-ink: #FFD1A0;
      --warn: #FF8A80; --warn-bg: #3F2427; --ok-bg: #213A35; --ok: #7FE0BA;
      --temp: #FF9E78; --hum: #7BBDF0; --band: rgba(94,209,166,.14);
      --fab: #FF9D9D; --on-fab: #2A1B1F;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button, input, a { font-family: inherit; touch-action: manipulation; color: inherit; }
  button { cursor: pointer; }
  button:active, .tile:active { transform: scale(0.97); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 10px 14px calc(110px + env(safe-area-inset-bottom)); }

  /* ヘッダー */
  header { display: flex; align-items: center; gap: 10px; padding: 4px 2px 12px; }
  .face { width: 44px; height: 44px; flex: none; }
  .hname { min-width: 0; display: flex; flex-direction: column; }
  .hname b { font-size: 20px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hname span { font-size: 13px; color: var(--sub); font-weight: 700; }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700;
    text-decoration: none; background: var(--card); box-shadow: var(--shadow); white-space: nowrap; }
  .chip i { width: 9px; height: 9px; border-radius: 5px; background: var(--sub); }
  #clock { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* ひと目で分かるタイル */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { position: relative; border-radius: 22px; padding: 12px 13px 11px; min-height: 124px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: var(--shadow); text-decoration: none; overflow: hidden; min-width: 0; }
  .tile .tt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; }
  .tile .tt svg { width: 20px; height: 20px; flex: none; }
  .tile .k { font-size: 11.5px; font-weight: 700; opacity: .8; margin-top: 2px; }
  .tile .v { font-size: 15px; font-weight: 700; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tile .v b { font-size: 30px; font-weight: 900; }
  .tile .s { font-size: 12px; font-weight: 700; opacity: .85; margin-top: auto; padding-top: 3px; line-height: 1.35; }
  .tile.milk { background: var(--milk-bg); color: var(--milk-ink); }
  .tile.dia { background: var(--dia-bg); color: var(--dia-ink); }
  .tile.room { background: var(--room-bg); color: var(--room-ink); }
  .tile.sky { background: var(--sky-bg); color: var(--sky-ink); }
  .tile.sum { background: var(--sum-bg); color: var(--sum-ink); }
  .tile.wt { background: var(--wt-bg); color: var(--wt-ink); }
  .tile.alert { box-shadow: inset 0 0 0 3px var(--warn), var(--shadow); }
  .tile .badge { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: var(--card); }
  .tile .badge.warn { color: var(--warn); }
  .tile .spark { position: absolute; right: 8px; bottom: 8px; width: 46%; opacity: .9; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: currentColor; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .wsm { display: flex; align-items: center; gap: 6px; }
  .wsm svg { width: 40px; height: 40px; flex: none; }

  /* タイムライン */
  .card { background: var(--card); border-radius: 22px; padding: 14px 14px 12px; box-shadow: var(--shadow); margin-top: 12px; }
  .ch { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 900; margin-bottom: 6px; }
  .ch .r { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--sub); }
  .tl { position: relative; height: 66px; margin: 4px 4px 0; }
  .tl .axis { position: absolute; left: 0; right: 0; top: 30px; height: 6px; border-radius: 3px; background: var(--line); }
  .tl .night { position: absolute; top: 30px; height: 6px; border-radius: 3px; background: rgba(120,110,170,.25); }
  .tl .ev { position: absolute; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .tl .ev.m { top: 4px; width: 24px; height: 24px; background: var(--milk); color: #fff; }
  .tl .ev.m.open { animation: pulse 1.4s infinite; }
  .tl .ev.d { top: 40px; width: 18px; height: 18px; }
  .tl .ev svg { width: 14px; height: 14px; }
  .tl .tick { position: absolute; top: 60px; transform: translateX(-50%); font-size: 10px; color: var(--sub); font-weight: 700; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--sub); font-weight: 700; margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; }

  .details { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 760px) { .details { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-size: 11px; fill: var(--sub); font-family: inherit; font-weight: 700; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--sub); margin-top: 4px; }
  .msg { padding: 7px 11px; border-radius: 12px; font-size: 13px; font-weight: 700; margin: 4px 0; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.note { background: var(--sum-bg); color: var(--sum-ink); line-height: 1.5; }
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .day { background: var(--sky-bg); color: var(--sky-ink); border-radius: 16px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day .d { font-size: 12px; font-weight: 900; } .day svg { width: 38px; height: 38px; }
  .day .w { font-size: 12px; font-weight: 700; } .day .tp { font-size: 14px; font-weight: 900; }
  .day .hi { color: var(--temp); } .day .lo { color: var(--hum); } .day .p { font-size: 11px; font-weight: 700; opacity: .8; }
  .list { font-size: 14px; }
  .list div { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); }
  .list div:last-child { border-bottom: 0; }
  .list .tm { font-weight: 900; font-variant-numeric: tabular-nums; width: 46px; }
  .list .ic { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .list .ic svg { width: 15px; height: 15px; }
  .list button { margin-left: auto; border: 0; background: none; font-size: 12px; color: var(--sub); text-decoration: underline; }
  .empty { font-size: 13px; color: var(--sub); padding: 6px 2px; }

  /* 記録ボタン（1か所） */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30;
    height: 64px; padding: 0 30px 0 24px; border-radius: 32px; border: 0; background: var(--fab); color: var(--on-fab);
    font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(255,120,120,.4); }
  .fab:active { transform: translateX(-50%) scale(0.96); }
  .fab svg { width: 28px; height: 28px; }
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(60,40,35,.35); display: none; align-items: flex-end; justify-content: center; }
  .sheet.show { display: flex; }
  .panel { width: min(560px, 100%); background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
    animation: up .22s ease-out; max-height: 92vh; overflow: auto; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .ph b { font-size: 20px; font-weight: 900; }
  .ph button { margin-left: auto; border: 0; background: var(--card); border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); }
  .ph .back { margin-left: 0; margin-right: 4px; }
  .menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .mi { border: 0; border-radius: 22px; padding: 16px 10px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 17px; font-weight: 900; box-shadow: var(--shadow); text-decoration: none; text-align: center; }
  .mi small { font-size: 12px; font-weight: 700; opacity: .8; }
  .mi svg { width: 40px; height: 40px; }
  .mi.milk { background: var(--milk-bg); color: var(--milk-ink); }
  .mi.dia { background: var(--dia-bg); color: var(--dia-ink); }
  .mi.wt { background: var(--wt-bg); color: var(--wt-ink); }
  .mi.cam { background: var(--sky-bg); color: var(--sky-ink); }
  .mi.wide { grid-column: 1 / -1; min-height: 92px; flex-direction: row; gap: 12px; }
  .ago { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
  .ago button { border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; background: var(--card); box-shadow: var(--shadow); }
  .ago button.on { background: var(--ink); color: var(--bg); }
  .wfield { display: flex; flex-direction: column; gap: 10px; }
  .wfield label { font-size: 13px; font-weight: 700; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
  .wfield input { height: 56px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-size: 24px; font-weight: 900; padding: 0 14px; width: 100%; }
  .save { height: 60px; border: 0; border-radius: 18px; background: var(--wt); color: #fff; font-size: 18px; font-weight: 900; margin-top: 4px; }
  #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
    display: none; align-items: center; gap: 12px; padding: 11px 12px 11px 18px; border-radius: 18px; background: var(--ink); color: var(--bg);
    font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 28px); white-space: nowrap; }
  .sheet.show ~ #toast { bottom: auto; top: calc(14px + env(safe-area-inset-top)); }
  #toast button { border: 0; border-radius: 12px; padding: 8px 12px; background: var(--bg); color: var(--ink); font-weight: 900; font-size: 14px; }
  #offline { display: none; }
  .party { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding: 14px 16px; border-radius: 22px;
    background: linear-gradient(120deg, #FFD6E0, #FFE9B8 55%, #D8F3E6); color: #8A3B4F; box-shadow: var(--shadow); }
  .party b { font-size: 20px; font-weight: 900; display: block; }
  .party span { font-size: 13px; font-weight: 700; }
  .party svg.cf { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .7; }
  .party .pi { width: 44px; height: 44px; flex: none; position: relative; }
  .soon { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 999px; background: var(--milk-bg); color: var(--milk-ink); font-size: 11.5px; font-weight: 900; }
  .mi.off { opacity: .55; }
  .feedhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .feedhead .ftag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--milk-bg); color: var(--milk-ink); font-size: 14px; font-weight: 900; }
  .feedhead .when { font-size: 15px; font-weight: 900; }
  .feedhead .when small { font-size: 12px; color: var(--sub); }
  .feedhead .adj { margin-left: auto; display: flex; gap: 6px; }
  .feedhead .adj button { border: 0; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; background: var(--card); box-shadow: var(--shadow); }
  .stp { display: flex; align-items: center; gap: 10px; border-radius: 20px; padding: 10px 12px; margin-bottom: 8px; }
  .stp.milkr { background: var(--milk-bg); color: var(--milk-ink); }
  .stp.breastr { background: var(--wt-bg); color: var(--wt-ink); }
  .stp .nm { width: 52px; font-size: 16px; font-weight: 900; }
  .stp .rb { width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--card); color: inherit; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); flex: none; }
  .stp .rb.plus { background: currentColor; }
  .stp .rb.plus span { color: var(--card); }
  .stp .val { flex: 1; text-align: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stp .val b { font-size: 44px; font-weight: 900; }
  .ftotal { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; font-size: 16px; font-weight: 900; margin: 2px 4px 10px; }
  .ftotal b { font-size: 40px; font-variant-numeric: tabular-nums; }
  .ftotal small { margin-right: auto; font-size: 12px; color: var(--sub); }
  .facts { display: grid; grid-template-columns: 1fr 2.2fr; gap: 8px; }
  .facts button { min-height: 60px; border-radius: 18px; border: 0; font-size: 16px; font-weight: 900; }
  .facts .q { background: var(--card); box-shadow: var(--shadow); }
  .facts .go { background: var(--fab); color: var(--on-fab); }
  .facts .go:disabled { opacity: .5; }
  .bigstart { width: 100%; min-height: 150px; border: 0; border-radius: 26px; background: var(--fab); color: var(--on-fab); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 8px 22px rgba(255,120,120,.35); }
  .bigstart b { font-size: 30px; font-weight: 900; } .bigstart span { font-size: 13px; font-weight: 700; opacity: .9; } .bigstart svg { width: 44px; height: 44px; }
  .later { width: 100%; margin-top: 10px; min-height: 52px; border: 0; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 15px; font-weight: 700; }
  .lastfeed { margin-top: 12px; font-size: 13px; color: var(--sub); font-weight: 700; text-align: center; }
  .gear { width: 40px; height: 40px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; padding: 0; }
  .gear svg { width: 22px; height: 22px; }
  #setCard .setrow { box-shadow: none; background: var(--soft, var(--bg)); }
  .setrow { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .setrow .tx { flex: 1; min-width: 0; }
  .setrow b { display: block; font-size: 16px; font-weight: 900; }
  .setrow span { font-size: 12.5px; color: var(--sub); font-weight: 700; line-height: 1.5; }
  .sw { width: 64px; height: 36px; border-radius: 18px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 14px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: left .2s; }
  .sw.on { background: var(--room); }
  .sw.on::after { left: 32px; }
  .setnote { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 10px; padding: 0 4px; }
  .foot { margin-top: 16px; text-align: center; font-size: 11px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="face" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="25" r="20" fill="#FFE9DA"/><path d="M22 6c3-2 6 0 4 3" fill="none" stroke="#E8A98A" stroke-width="2.5" stroke-linecap="round"/><circle cx="17" cy="24" r="2.2" fill="#4A3F3A"/><circle cx="31" cy="24" r="2.2" fill="#4A3F3A"/><ellipse cx="13" cy="30" rx="3.5" ry="2.2" fill="#FFB3B3"/><ellipse cx="35" cy="30" rx="3.5" ry="2.2" fill="#FFB3B3"/><path d="M20 31c2.2 2.4 5.8 2.4 8 0" fill="none" stroke="#4A3F3A" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div class="hname"><b id="bname">育児の記録</b><span id="bdays"></span></div>
    <div class="hright">
      <a class="chip" id="mon" href="/"><i></i><span>見守り</span></a>
      <span id="clock">--:--</span>
    </div>
  </header>
  <div id="party"></div>
  <div class="msg warn" id="offline">ラズパイにつながりません。家のWi-Fiか Tailscale がオンか確認してください。</div>

  <!-- ひと目で分かるタイル（押すと下の詳しい表示へ） -->
  <div class="tiles" id="tiles"></div>

  <!-- 24時間のながれ -->
  <section class="card" id="tlCard">
    <div class="ch">きょうのながれ<span class="r">直近24時間</span></div>
    <div class="tl" id="tl"></div>
    <div class="legend"><span><i style="background:var(--milk)"></i>ミルク・母乳</span><span><i style="background:var(--dia)"></i>おしっこ</span><span><i style="background:var(--poo)"></i>うんち</span><span><i style="background:rgba(120,110,170,.35)"></i>夜</span></div>
  </section>

  <div class="details">
    <section class="card" id="roomCard"></section>
    <section class="card" id="wtCard"></section>
    <section class="card" id="skyCard"></section>
    <section class="card" id="logCard"></section>
  </div>
  <section class="card" id="setCard"></section>
  <div class="foot" id="foot"></div>
</div>

<button class="fab" id="fab" aria-label="記録する">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>きろく</button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="panel" id="panel"></div>
</div>
<div id="toast" role="status"><span id="tmsg"></span><button id="tundo">取り消す</button></div>

<script>
const $ = (id) => document.getElementById(id);
let D = null, undoId = null, toastTimer = null, diaperAgo = 0;

const SOURCE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'ベッド横の画面' : 'スマホ・PC';

/* ---------- 折れ線グラフ（SVG） ---------- */
function lineChart(pts, o) {
  const W = 340, H = o.h || 110, L = 32, R = 8, T = 8, B = 18;
  if (!pts.length) return '<div class="empty">まだデータがありません</div>';
  const ys = pts.map((p) => p.y).concat(o.band || []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max((y1 - y0) * 0.15, o.minSpan || 1); y0 -= pad; y1 += pad;
  const x0 = o.xmin ?? pts[0].x, x1 = o.xmax ?? pts[pts.length - 1].x;
  const sx = (x) => L + (W - L - R) * (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0));
  const sy = (y) => T + (H - T - B) * (1 - (y - y0) / (y1 - y0));
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || '') + '">';
  if (o.band) s += '<rect rx="6" x="' + L + '" width="' + (W - L - R) + '" y="' + sy(o.band[1]) + '" height="' + (sy(o.band[0]) - sy(o.band[1])) + '" fill="var(--band)"/>';
  for (let i = 0; i <= 2; i++) {
    const v = y0 + (y1 - y0) * i / 2, y = sy(v);
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-dasharray="3 4"/>';
    s += '<text x="' + (L - 4) + '" y="' + (y + 4) + '" text-anchor="end">' + v.toFixed(o.dec ?? 0) + '</text>';
  }
  (o.ticks || []).forEach(([x, t], i, a) => { const an = i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle';
    s += '<text x="' + sx(x) + '" y="' + (H - 3) + '" text-anchor="' + an + '">' + t + '</text>'; });
  const path = pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');
  s += '<path d="' + path + '" fill="none" stroke="' + o.color + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  if (o.dots) pts.forEach((p) => { s += '<circle cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r="4" fill="var(--card)" stroke="' + o.color + '" stroke-width="2.5"/>'; });
  const last = pts[pts.length - 1];
  s += '<circle cx="' + sx(last.x) + '" cy="' + sy(last.y) + '" r="5" fill="' + o.color + '" stroke="var(--card)" stroke-width="2"/>';
  return s + '</svg>';
}
function spark(vals, color) {
  if (vals.length < 2) return '';
  const W = 100, H = 30, a = Math.min(...vals), b = Math.max(...vals), span = Math.max(b - a, 0.5);
  const p = vals.map((v, i) => (i ? 'L' : 'M') + (i * W / (vals.length - 1)).toFixed(1) + ' ' + (H - 3 - (v - a) / span * (H - 6)).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="' + p + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* ---------- タイル ---------- */
function envState() {
  const e = D.env;
  if (!e.latest) return { out: false, msgs: [] };
  const r = e.range, t = e.latest.temp, h = e.latest.hum, msgs = [];
  if (t < r.temp_min) msgs.push('寒い'); if (t > r.temp_max) msgs.push('暑い');
  if (h < r.hum_min) msgs.push('乾燥'); if (h > r.hum_max) msgs.push('じめじめ');
  return { out: msgs.length > 0, msgs };
}

/* ---------- 24時間のながれ ---------- */
function renderTimeline() {
  const now = Date.now(), x0 = now - 24 * 3600e3, pos = (ts) => Math.max(0, Math.min(100, (new Date(ts).getTime() - x0) / (24 * 3600e3) * 100));
  let h = '<div class="axis"></div>';
  // 夜（21時〜7時）の帯
  const n = D.night || { start: 21, end: 7 };
  for (let k = -1; k <= 1; k++) {
    const d = new Date(); d.setHours(n.start, 0, 0, 0); d.setDate(d.getDate() + k);
    const a = d.getTime(), b = a + ((24 - n.start + n.end) % 24) * 3600e3;
    const l = Math.max(x0, a), r = Math.min(now, b);
    if (r > l) h += '<div class="night" style="left:' + ((l - x0) / 864e3).toFixed(2) + '%;width:' + ((r - l) / 864e3).toFixed(2) + '%"></div>';
  }
  for (let k = 0; k <= 4; k++) {
    const x = x0 + k * 6 * 3600e3;
    h += '<div class="tick" style="left:' + (k * 25) + '%">' + (k === 4 ? '今' : new Date(x).getHours() + '時') + '</div>';
  }
  D.timeline.feeds.forEach((f) => { h += '<div class="ev m' + (f.status === 'open' ? ' open' : '') + '" style="left:' + pos(f.ts) + '%" title="' + f.time + ' ' + (f.amount || '') + 'ml">' + IC.milk + '</div>'; });
  D.timeline.diapers.forEach((d) => {
    const col = d.kind === 'pee' ? 'var(--dia)' : 'var(--poo)';
    h += '<div class="ev d" style="left:' + pos(d.ts) + '%;background:' + col + ';color:#fff" title="' + d.time + ' ' + d.label + '">' + (d.kind === 'pee' ? IC.drop : IC.poo) + '</div>';
  });
  $('tl').innerHTML = h;
}

function renderWeight() {

  } else h += '<div class="lbl">最新 ' + last.grams + 'g（' + last.day.slice(5).replace('-', '/') + '）</div>';

}

    .sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 12);
  let h = '<div class="ch">さいきんの記録<span class="r">直近24時間</span></div>';
  if (!ev.length) { $('logCard').innerHTML = h + '<div class="empty">まだ記録がありません。下の「きろく」から入れてください。</div>'; return; }
  h += '<div class="list">' + ev.map((e) => {
    if (e.type === 'm') {
      const f = e.f;
      return '<div><span class="tm">' + f.time + '</span><span class="ic" style="background:var(--milk-bg);color:var(--milk-ink)">' + IC.milk + '</span>' +
        (f.status === 'open' ? '<b style="color:var(--milk-ink)">授乳中</b>' : '<span><b>' + f.amount + 'ml</b> <span style="color:var(--sub);font-size:12px">ミルク' + f.milk + '・母乳' + f.breast + '</span></span>') + '</div>';
    }
    const d = e.d, col = d.kind === 'pee' ? 'var(--dia)' : 'var(--poo)';
    return '<div><span class="tm">' + d.time + '</span><span class="ic" style="background:' + col + ';color:#fff">' + (d.kind === 'pee' ? IC.drop : IC.poo) + '</span>' + d.label + '</div>';
  }).join('') + '</div>';
  $('logCard').innerHTML = h;
}
function confetti() {
  const cols = ['#FF8E8E', '#F2B632', '#4FBF95', '#5AA9E6', '#9B83E8'];
  let s = '<svg class="cf" viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">';
  for (let i = 0; i < 26; i++) {
    const x = (i * 53) % 300, y = (i * 29) % 80, c = cols[i % 5], r = (i * 37) % 180;
    s += i % 3 ? '<rect x="' + x + '" y="' + y + '" width="6" height="3" rx="1" fill="' + c + '" transform="rotate(' + r + ' ' + x + ' ' + y + ')"/>' : '<circle cx="' + x + '" cy="' + y + '" r="2.2" fill="' + c + '"/>';
  }
  return s + '</svg>';
}
function renderHeader() {
  const b = D.baby;
  $('bname').textContent = b.name || '育児の記録';
  const ms = b.milestone || {};
  if (b.days != null && b.days >= 0) {
    const months = Math.floor(b.days / 30.44);
    $('bdays').innerHTML = '生後 ' + b.days + '日' + (months >= 1 ? '（' + months + 'か月）' : '') +
      (!ms.today && ms.next && ms.next.in_days <= 3 ? '<br><span class="soon">あと' + ms.next.in_days + '日で ' + esc(ms.next.label) + '</span>' : '');
  } else $('bdays').textContent = '';
  $('party').innerHTML = ms.today ? '<div class="party">' + confetti() +
    '<svg class="pi" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 44 18 14l16 16z" fill="#FF8E8E"/><path d="M10 34l6 6M13 26l10 10" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="10" r="3" fill="#F2B632"/><circle cx="40" cy="20" r="2.5" fill="#4FBF95"/><circle cx="38" cy="7" r="2" fill="#9B83E8"/><path d="M24 6c2 3 1 5-1 7M42 28c-3 1-5 0-6-2" stroke="#5AA9E6" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>' +
    '<div style="position:relative"><b>今日で ' + esc(ms.today) + '！</b><span>おめでとうございます。記念の写真を撮っておきましょう</span></div></div>' : '';
  const m = D.monitor, map = { WATCHING: ['見守り中', m.face_visible ? 'var(--room)' : 'var(--sum)'], WAITING: ['確認中', 'var(--dia)'],
    ALERT: ['アラート', 'var(--warn)'], PAUSED: ['一時停止', 'var(--sub)'], NO_CAMERA: ['カメラなし', 'var(--sub)'] };
  const [t, col] = map[m.phase] || ['見守り', 'var(--sub)'];
  $('mon').innerHTML = '<i style="background:' + col + '"></i><span>' + t + '</span>';
  $('mon').href = camLink || '#';
}
function renderAll() {
  if (!D) return;
  renderHeader(); renderTiles(); renderTimeline(); renderRoom(); renderWeight(); renderSky(); renderLog(); renderSettings();
  $('foot').textContent = (D.pending ? '共有シートへ未送信 ' + D.pending + '件（自動で再送）・' : '') + '30秒ごとに更新';
  if ($('sheet').classList.contains('show') && sheetView === 'menu') openMenu();
}

/* ---------- 記録（1か所に集約） ---------- */
let sheetView = '';
function openSheet(html, view) { sheetView = view; $('panel').innerHTML = '<div class="grab"></div>' + html; $('sheet').classList.add('show'); }
function closeSheet() { $('sheet').classList.remove('show'); sheetView = ''; }
function openMenu() {
  const o = D && D.milk && D.milk.open;
  openSheet('<div class="ph"><b id="ptitle">なにを記録する？</b><button data-act="close">とじる</button></div><div class="menu">' +
    '<button class="mi milk" data-act="milk">' + IC.milk + (o ? '授乳をおわる<small>' + o.time + ' から ' + o.elapsed_min + '分</small>' : 'ミルク・母乳<small>あげ始めに押す</small>') + '</button>' +
    '<button class="mi dia" data-act="diaper">' + IC.dia + 'おむつ<small>おしっこ・うんち</small></button>' +
    '<button class="mi wt" data-act="weight">' + IC.wt + 'たいじゅう<small>g で入れる</small></button>' +
    (camLink ? '<a class="mi cam" href="' + camLink + '">' + IC.cam + '見守りカメラ<small>家のWi-Fi</small></a>'
             : '<button class="mi cam off" data-act="nocam">' + IC.cam + '見守りカメラ<small>家のWi-Fiで見られます</small></button>') + '</div>', 'menu');
}
function openDiaper() {
  const agoBtns = [[0, 'いま'], [10, '10分前'], [30, '30分前'], [60, '1時間前']].map(([v, t]) => '<button data-ago="' + v + '" class="' + (v === diaperAgo ? 'on' : '') + '">' + t + '</button>').join('');
  openSheet('<div class="ph"><button class="back" data-act="menu">‹ もどる</button><b id="ptitle">おむつ</b><button data-act="close">とじる</button></div>' +
    '<div class="lbl">いつ替えた？</div><div class="ago">' + agoBtns + '</div>' +
    '<div class="menu"><button class="mi dia" data-diaper="pee">' + IC.drop + 'おしっこ</button>' +
    '<button class="mi dia" data-diaper="poo" style="color:var(--poo)">' + IC.poo + 'うんち</button>' +
    '<button class="mi dia wide" data-diaper="both"><span style="display:flex;gap:4px">' + IC.drop + IC.poo + '</span>おしっこ＋うんち</button></div>', 'diaper');
}
function openWeight() {
  const d = new Date(), today = d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate());
  const last = D.weights.length ? D.weights[D.weights.length - 1].grams : '';
  openSheet('<div class="ph"><button class="back" data-act="menu">‹ もどる</button><b id="ptitle">たいじゅう</b><button data-act="close">とじる</button></div>' +
    '<form class="wfield" id="wform"><label>体重（g）<input id="wgrams" type="number" inputmode="numeric" min="1000" max="30000" placeholder="' + (last ? '前回 ' + last : '例 3450') + '" required></label>' +
    '<label>日付<input id="wday" type="date" value="' + today + '" max="' + today + '" required></label>' +
    '<button class="save" type="submit">記録する</button></form>', 'weight');
  setTimeout(() => $('wgrams') && $('wgrams').focus(), 250);
}
$('fab').onclick = openMenu;

/* ---------- ミルク・母乳（スマホ用のパネル） ---------- */
let feed = { mode: '', milk: 0, breast: 0, adj: 0, edited: false };   // mode: start / open / later
const mcfg = () => D.milk_config || { step_ml: 10, breast_step_ml: 5, max_ml: 300, default_ml: 100 };
function openMilk() {
  const m = D.milk, o = m && m.open;
  if (o) {
    if (feed.mode !== 'open' || !feed.edited) {
      feed = { mode: 'open', milk: m.last ? o.suggest_milk : mcfg().default_ml, breast: o.suggest_breast, adj: 0, edited: false };
    }
    return renderFeed();
  }
  feed.mode = 'start';
  const l = m && m.last;
  openSheet('<div class="ph"><button class="back" data-act="menu">‹ もどる</button><b id="ptitle">ミルク・母乳</b><button data-act="close">とじる</button></div>' +
    '<button class="bigstart" data-act="feedstart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>' +
    '<b>あげ始める</b><span>押した時刻が開始時刻になります</span></button>' +
    '<button class="later" data-act="feedlater">押し忘れたとき：あとからまとめて記録</button>' +
    (l ? '<div class="lastfeed">前回 ' + l.time + ' 開始・' + l.amount + 'ml（' + l.ago_text + '）</div>' : ''), 'milk');
}
function feedStart() {
  const o = D.milk && D.milk.open;
  if (feed.mode === 'open' && o) return new Date(new Date(o.ts).getTime() + feed.adj * 60000);
  return new Date(Date.now() - feed.adj * 60000);
}
function renderFeed() {
  const c = mcfg(), t = feedStart(), mins = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000)), total = feed.milk + feed.breast;
  const open = feed.mode === 'open';
  openSheet('<div class="ph"><button class="back" data-act="menu">‹ もどる</button><b id="ptitle">' + (open ? '授乳中' : 'あとから記録') + '</b><button data-act="close">とじる</button></div>' +
    '<div class="feedhead">' + (open ? '<span class="ftag"><span class="pulse"></span>授乳中</span>' : '') +
    '<span class="when">' + (open ? '開始 ' : 'あげ始め ') + t.getHours() + ':' + two(t.getMinutes()) + ' <small>（' + (mins < 1 ? 'たった今' : mins + '分前') + '）</small></span>' +
    '<span class="adj"><button data-act="fminus">−5分</button><button data-act="fplus">＋5分</button></span></div>' +
    '<div class="stp milkr"><span class="nm">ミルク</span><button class="rb" data-step="milk" data-d="-1" aria-label="ミルクを減らす">−</button>' +
    '<span class="val"><b>' + feed.milk + '</b>ml</span><button class="rb plus" data-step="milk" data-d="1" aria-label="ミルクを増やす"><span>＋</span></button></div>' +
    '<div class="stp breastr"><span class="nm">母乳</span><button class="rb" data-step="breast" data-d="-1" aria-label="母乳を減らす">−</button>' +
    '<span class="val"><b>' + feed.breast + '</b>ml</span><button class="rb plus" data-step="breast" data-d="1" aria-label="母乳を増やす"><span>＋</span></button></div>' +
    '<div class="ftotal"><small>ミルク ' + c.step_ml + 'ml・母乳 ' + (c.breast_step_ml || 5) + 'ml ずつ</small>合計<b>' + total + '</b>ml</div>' +
    '<div class="facts"><button class="q" data-act="' + (open ? 'feedcancel' : 'milk') + '">' + (open ? 'やめる' : 'もどる') + '</button>' +
    '<button class="go" data-act="feedfinish"' + (total <= 0 ? ' disabled' : '') + '>' + (total <= 0 ? '量を入れてください' : (open ? 'あげ終わった・' : '') + total + 'ml を記録') + '</button></div>', 'feed');
}
function isoLocal(d) {
  const off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-';
  return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + 'T' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':00' + sg + two(Math.floor(Math.abs(off) / 60)) + ':' + two(Math.abs(off) % 60);
}
async function feedAct(act) {
  const c = mcfg();
  if (act === 'milk') return openMilk();
  if (act === 'feedstart') {
    const j = await post('/api/feed/start', {}); D = { ...D, milk: j }; feed.mode = ''; openMilk(); renderAll(); toast(j.record.time + ' に開始しました');
  } else if (act === 'feedlater') {
    const l = D.milk && D.milk.last;
    feed = { mode: 'later', milk: l ? l.milk : c.default_ml, breast: l ? l.breast : 0, adj: 20, edited: false }; renderFeed();
  } else if (act === 'fminus' || act === 'fplus') {
    const d = act === 'fminus' ? 5 : -5;              // open：開始時刻を前後／later：何分前を増減
    if (feed.mode === 'open') {
      const o = D.milk.open, maxFwd = Math.floor((Date.now() - new Date(o.ts).getTime()) / 60000);
      feed.adj = Math.max(-600, Math.min(maxFwd, feed.adj - d));
    } else feed.adj = Math.max(0, Math.min(600, feed.adj + d));
    feed.edited = true; renderFeed();
  } else if (act === 'feedcancel') {
    if (!confirm('この授乳を記録しないで消しますか？')) return;
    const j = await post('/api/feed/undo', { id: D.milk.open.id }); D = { ...D, milk: j }; feed.mode = ''; closeSheet(); await refresh(); toast('授乳を取り消しました');
  } else if (act === 'feedfinish') {
    let j;
    if (feed.mode === 'open') {
      const body = { id: D.milk.open.id, milk: feed.milk, breast: feed.breast };
      if (feed.adj) body.start = isoLocal(feedStart());
      j = await post('/api/feed/finish', body);
    } else j = await post('/api/feed/add', { milk: feed.milk, breast: feed.breast, minutes_ago: feed.adj });
    const r = j.record; feed = { mode: '', milk: r.milk, breast: r.breast, adj: 0, edited: false };
    closeSheet(); await refresh();
    toast(r.amount + 'ml を記録（ミルク' + r.milk + '・母乳' + r.breast + '）', r.id, 'feed');
  }
}
function renderSettings() {
  const e = D.env, r = e.range, on = !!e.alert;
  $('setCard').innerHTML = '<div class="ch"><span style="width:22px;height:22px;color:var(--sub)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span>設定</div>' +
    '<div class="setrow"><div class="tx"><b>お部屋の「暑い・寒い」通知</b><span>室温 ' + r.temp_min + '〜' + r.temp_max + '℃・湿度 ' + r.hum_min + '〜' + r.hum_max + '% を外れたら Discord に知らせます</span></div>' +
    '<button class="sw' + (on ? ' on' : '') + '" data-act="envalert" role="switch" aria-checked="' + on + '" aria-label="お部屋の通知"></button></div>' +
    '<div class="setnote">オフにしても、画面の「暑い」「寒い」の表示とグラフはそのまま出ます。<br>目安の温度・湿度は、ラズパイの <code>config/settings.toml</code> の <code>[env]</code> で変えられます。</div>';
}
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { const act = a.dataset.act;
    if (act === 'envalert') {
      try {
        await post('/api/settings', { env_alert: !D.env.alert });
        await refresh();
        toast('お部屋の通知を' + (D.env.alert ? 'オン' : 'オフ') + 'にしました');
      } catch (err) { toast(err.message); }
      return;
    }
    if (['milk', 'feedstart', 'feedlater', 'fminus', 'fplus', 'feedcancel', 'feedfinish'].includes(act)) {
      try { await feedAct(act); } catch (err) { toast(err.message); }
      return;
    }
    if (act === 'nocam') { toast('カメラは家のWi-Fiにつないだときだけ見られます'); return; }
    if (act === 'close') closeSheet(); else if (act === 'menu') openMenu(); else if (act === 'diaper') openDiaper(); else if (act === 'weight') openWeight();
    return; }
  const st = e.target.closest('[data-step]');
  if (st) {
    const c = mcfg(), k = st.dataset.step, step = k === 'breast' ? (c.breast_step_ml || 5) : c.step_ml;
    feed[k] = Math.max(0, Math.min(c.max_ml, feed[k] + Number(st.dataset.d) * step)); feed.edited = true; renderFeed();
    return;
  }
  const ag = e.target.closest('[data-ago]');
  if (ag) { diaperAgo = Number(ag.dataset.ago); openDiaper(); return; }
  const b = e.target.closest('[data-diaper]');
  if (b) {
    try { const j = await post('/api/diaper', { kind: b.dataset.diaper, minutes_ago: diaperAgo }); D = j; diaperAgo = 0; closeSheet(); renderAll();
      toast(j.record.ts.slice(11, 16) + ' ' + j.record.label + ' を記録', j.record.id); }
    catch (err) { toast(err.message); }
    return;
  }
  const w = e.target.closest('[data-wdel]');
  if (w) {
    if (!confirm(w.dataset.wdel.replace(/-/g, '/') + ' の体重を消しますか？')) return;
    try { const j = await post('/api/weight/delete', { day: w.dataset.wdel }); D = j; renderAll(); toast('消しました'); } catch (err) { toast(err.message); }
  }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'wform') return;
  e.preventDefault();
  try { const j = await post('/api/weight', { grams: Number($('wgrams').value), day: $('wday').value });
    D = j; closeSheet(); renderAll(); toast(j.record.grams + 'g を記録しました'); }
  catch (err) { toast(err.message); }
});

/* ---------- 通信 ---------- */
async function refresh() {
  try { const r = await fetch('/api/dash', { cache: 'no-store' }); D = await r.json(); $('offline').style.display = 'none'; await checkCamera(); renderAll(); }
  catch (e) { $('offline').style.display = 'block'; }
}
// いま家のWi-Fiにいるか：このページを家のアドレスで開いていればそのまま。
// Tailscale で開いているときは、家のアドレスに小さな確認を送って、届けば家にいると判断する
async function checkCamera() {
  const c = D.camera || {};
  if (c.here) { camLink = '/cam'; return; }
  const key = c.lan_url + '|' + Math.floor(Date.now() / 60000);
  if (!c.lan_url || lanChecked === key) return;
  lanChecked = key;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(c.lan_url + '/api/lan', { cache: 'no-store', signal: ctl.signal });
    clearTimeout(tm);
    camLink = r.ok ? '/cam' : null;   // 映像は /cam が家のアドレスから直接読み込む（アプリの中のまま）
  } catch (e) { camLink = null; }
}
$('mon').addEventListener('click', (e) => { if (!camLink) { e.preventDefault(); toast('カメラは家のWi-Fiにつないだときだけ見られます'); } });
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: SOURCE, ...body }) });
  const j = await r.json();
  if (!r.ok || !j.ok) throw new Error(j.error || 'うまく記録できませんでした');
  return j;
}
let undoKind = 'diaper';
function toast(msg, id, kind) {
  $('tmsg').textContent = msg; undoId = id || null; undoKind = kind || 'diaper'; $('tundo').style.display = id ? '' : 'none'; $('toast').style.display = 'flex';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').style.display = 'none'; undoId = null; }, 10000);
}
$('tundo').onclick = async () => {
  if (!undoId) return;
  try {
    if (undoKind === 'feed') {
      await post('/api/feed/undo', { id: undoId }); feed.mode = 'open'; feed.adj = 0; feed.edited = true; await refresh(); openMilk(); toast('取り消しました。量を直して記録し直せます');
    } else { const j = await post('/api/diaper/undo', { id: undoId }); D = j; renderAll(); toast('取り消しました'); }
  } catch (err) { toast(err.message); }
};
function tick() { const d = new Date(); $('clock').textContent = d.getHours() + ':' + two(d.getMinutes()); }
tick(); setInterval(tick, 10000);
refresh(); setInterval(refresh, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
