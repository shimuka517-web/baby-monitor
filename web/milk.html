<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミルク・母乳の記録</title>
<style>
  :root {
    --bg: #F4F2EC; --ink: #1D2430; --sub: #4A5363; --line: #C9C4B8;
    --card: #FFFFFF; --blue: #1F5FB8; --blue-ink: #12304F; --blue-bg: #E4EEFA;
    --pink: #B8487A; --pink-bg: #FBE8F0; --orange: #C26A00; --orange-bg: #FFF1DE;
    --ok-bg: #E7F4EC; --ok-ink: #155C3A; --warn-bg: #FFF3D6; --warn-ink: #6B4A00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  button, a { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  button:active, a:active { transform: scale(0.97); }
  svg { flex: none; }
  .page { min-height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 20px; padding: 14px 28px; }
  .back { height: 64px; padding: 0 24px 0 16px; border-radius: 18px; border: 2px solid var(--ink);
    background: var(--card); color: var(--ink); text-decoration: none; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  h1 { margin: 0; font-size: 36px; font-weight: 900; white-space: nowrap; }
  #clock { margin-left: auto; font-size: 30px; font-weight: 700; }
  main { flex: 1; display: flex; gap: 24px; padding: 0 28px 28px; flex-wrap: wrap; }
  .entry { flex: 999 1 560px; min-width: 0; background: var(--card); border-radius: 24px;
    padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; }
  .hidden { display: none !important; }

  /* はじめる */
  .startbtn { flex: 1; min-height: 240px; border: 0; border-radius: 28px; background: var(--blue); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .startbtn b { font-size: 64px; font-weight: 900; line-height: 1.1; }
  .startbtn span { font-size: 24px; font-weight: 500; opacity: .9; }
  .ghost { min-height: 88px; border-radius: 22px; border: 3px solid var(--ink); background: var(--card); color: var(--ink);
    font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .lead { font-size: 22px; color: var(--sub); line-height: 1.5; }

  /* 量を入れる */
  .topline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; font-size: 22px; font-weight: 900; }
  .chip.live { background: var(--orange-bg); color: var(--orange); }
  .chip.live i { width: 12px; height: 12px; border-radius: 6px; background: var(--orange); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .when { font-size: 26px; font-weight: 700; }
  .when small { font-size: 20px; font-weight: 500; color: var(--sub); }
  .adj { margin-left: auto; display: flex; gap: 10px; }
  .adj button { height: 56px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 20px; font-weight: 700; }
  .rowx { display: grid; grid-template-columns: 120px 104px 1fr 104px; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 20px; }
  .rowx.milk { background: var(--blue-bg); color: var(--blue-ink); }
  .rowx.breast { background: var(--pink-bg); color: #6E1F45; }
  .rowx .name { font-size: 30px; font-weight: 900; }
  .round { width: 104px; height: 104px; border-radius: 52px; border: 3px solid currentColor; background: var(--card); color: inherit;
    display: flex; align-items: center; justify-content: center; }
  .round.plus { background: currentColor; }
  .round.plus svg { stroke: #fff; }
  .val { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .val b { font-size: 84px; font-weight: 900; line-height: 1; }
  .val span { font-size: 32px; font-weight: 700; }
  .total { display: flex; align-items: baseline; justify-content: flex-end; gap: 12px; font-size: 28px; font-weight: 700; }
  .total b { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .total small { font-size: 20px; font-weight: 500; color: var(--sub); margin-right: auto; }
  .actions { display: grid; grid-template-columns: 1fr 2.4fr; gap: 14px; margin-top: auto; }
  .actions .ghost { min-height: 104px; font-size: 24px; }
  .finish { min-height: 104px; border: 0; border-radius: 24px; background: var(--blue); color: #fff; font-size: 32px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; gap: 12px; }
  .finish:disabled { opacity: .5; }

  /* 右側 */
  .side { flex: 1 1 300px; background: var(--blue-bg); color: var(--blue-ink); border-radius: 24px;
    padding: 24px 26px; display: flex; flex-direction: column; gap: 6px; }
  .side .k { font-size: 21px; font-weight: 700; }
  .big { font-size: 44px; font-weight: 900; line-height: 1.15; white-space: nowrap; }
  .mid { font-size: 40px; font-weight: 900; line-height: 1.1; }
  .mid small { font-size: 22px; font-weight: 700; }
  .rule { height: 2px; background: #B9CCE6; margin: 8px 0; }
  .split { font-size: 20px; font-weight: 700; }
  .list { display: flex; flex-direction: column; gap: 6px; font-size: 20px; margin-top: 6px; }
  .list div { display: flex; justify-content: space-between; gap: 8px; }
  .list small { font-size: 15px; color: var(--sub); }
  #sync { margin-top: auto; font-size: 17px; padding: 8px 12px; border-radius: 12px; }
  #sync.ok { background: var(--ok-bg); color: var(--ok-ink); }
  #sync.warn { background: var(--warn-bg); color: var(--warn-ink); }
  #err { display: none; margin: 0 28px 16px; padding: 12px 16px; border-radius: 12px; background: #FDE2DE; color: #8E1F12; font-size: 20px; font-weight: 700; }

  /* 記録した直後・はじめた直後 */
  .overlay { position: fixed; inset: 0; background: rgba(60,56,50,0.6); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .dcard { width: min(780px, 100%); background: var(--card); border-radius: 32px; padding: 36px 44px 30px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .dtitle { font-size: 48px; font-weight: 900; line-height: 1.2; }
  .dsplit { font-size: 28px; font-weight: 700; }
  .dtime { font-size: 26px; font-weight: 500; color: var(--sub); }
  .dbtns { width: 100%; margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .dbtns button, .dbtns a { min-height: 100px; border-radius: 22px; font-size: 26px; font-weight: 700; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-decoration: none; }
  .dbtns .light { border: 3px solid var(--ink); background: var(--card); color: var(--ink); }
  .dbtns .light small { font-size: 18px; font-weight: 500; color: var(--sub); }
  .dbtns .light:disabled { opacity: .4; }
  .dbtns .dark { background: var(--ink); color: #fff; border: 0; }
  .dnote { font-size: 18px; color: var(--sub); line-height: 1.5; }
  .dchip { padding: 8px 16px; border-radius: 999px; font-size: 19px; font-weight: 700; }

  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 50; padding: 14px 26px; border-radius: 14px;
    background: var(--orange); color: #fff; font-size: 24px; font-weight: 700; display: none; }
  @media (max-width: 760px) {
    header { padding: 12px 16px; gap: 12px; } main { padding: 0 16px 16px; }
    .back { height: 52px; padding: 0 14px 0 8px; font-size: 20px; }
    h1 { font-size: 24px; } #clock { font-size: 22px; } .entry { padding: 18px; gap: 12px; }
    .startbtn { min-height: 180px; } .startbtn b { font-size: 44px; } .startbtn span { font-size: 18px; }
    .ghost { font-size: 20px; min-height: 72px; }
    .rowx { grid-template-columns: 1fr auto auto auto; gap: 8px; padding: 10px; }
    .rowx .name { font-size: 20px; } .round { width: 64px; height: 64px; } .round svg { width: 30px; height: 30px; }
    .val b { font-size: 48px; } .val span { font-size: 20px; }
    .adj { margin-left: 0; } .adj button { height: 48px; font-size: 17px; }
    .total { white-space: nowrap; } .total small { display: none; } .total b { font-size: 44px; } .finish { font-size: 22px; min-height: 84px; } .actions .ghost { min-height: 84px; font-size: 18px; }
    .dtitle { font-size: 32px; } .dsplit { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <a class="back" href="/">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>戻る</a>
    <h1>ミルク・母乳</h1>
    <div id="clock">--:--</div>
  </header>
  <div id="err" role="alert"></div>
  <main>
    <!-- 授乳していないとき -->
    <section class="entry" id="idle">
      <div class="lead">あげ始めに押してください。飲み終わったら、ミルクと母乳の量を入れます。</div>
      <button class="startbtn" id="startBtn">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
        <b>あげ始める</b><span>押した時刻を、開始時刻として記録します</span></button>
      <button class="ghost" id="laterBtn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        押し忘れたとき：あとからまとめて記録</button>
    </section>

    <!-- 授乳中（量を入れる）／あとから記録 -->
    <section class="entry hidden" id="form">
      <div class="topline">
        <span class="chip live" id="liveChip"><i></i>授乳中</span>
        <span class="when" id="when"></span>
        <div class="adj">
          <button id="tMinus">−5分</button>
          <button id="tPlus">＋5分</button>
        </div>
      </div>
      <div class="rowx milk">
        <span class="name">ミルク</span>
        <button class="round" data-k="milk" data-d="-1" aria-label="ミルクを減らす"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div class="val" aria-live="polite"><b id="milkV">0</b><span>ml</span></div>
        <button class="round plus" data-k="milk" data-d="1" aria-label="ミルクを増やす"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="rowx breast">
        <span class="name">母乳</span>
        <button class="round" data-k="breast" data-d="-1" aria-label="母乳を減らす"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div class="val" aria-live="polite"><b id="breastV">0</b><span>ml</span></div>
        <button class="round plus" data-k="breast" data-d="1" aria-label="母乳を増やす"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="total"><small>この回にあげた量</small>合計<b id="totalV">0</b>ml</div>
      <div class="actions">
        <button class="ghost" id="cancelBtn">やめる</button>
        <button class="finish" id="finishBtn">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          <span id="finishLabel">あげ終わった・記録する</span></button>
      </div>
    </section>

    <aside class="side">
      <div class="k">前回から（あげ始めから）</div>
      <div class="big" id="ago">記録なし</div>
      <div id="lastline" style="font-size:19px"></div>
      <div class="rule"></div>
      <div class="k">今日の合計</div>
      <div class="mid"><span id="total">0</span>ml<small id="count">（0回）</small></div>
      <div class="split" id="todaySplit"></div>
      <div class="list" id="recent"></div>
      <div id="sync"></div>
    </aside>
  </main>
</div>

<!-- 記録した直後 -->
<div class="overlay" id="done" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dcard">
    <svg width="88" height="88" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1F5FB8"/><path d="m7 12.5 3.2 3.2L17 8.8" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="dtitle" id="dtitle"></div>
    <div class="dsplit" id="dsplit"></div>
    <div class="dtime" id="dtime"></div>
    <div class="dchip" id="dsync"></div>
    <div class="dbtns">
      <button class="light" id="undo">取り消す<small id="undoleft"></small></button>
      <a class="dark" href="/">メイン画面へ</a>
    </div>
    <div class="dnote">ネットにつながっていないときは、つながってから送ります。<br>しばらくすると自動でメイン画面に戻ります。</div>
  </div>
</div>

<div id="toast" role="status"></div>
<script>
let cfg = { default_ml: 100, step_ml: 10, breast_step_ml: 5, max_ml: 300, undo_sec: 10 };
let st = null;                 // /api/milk の結果
let mode = 'idle';             // idle / open / later
let vals = { milk: 0, breast: 0 };
let startAdj = 0;              // 開始時刻の修正（分）。later では「何分前に始めたか」
let edited = false, lastRec = null, timers = [];
const $ = (id) => document.getElementById(id);
const SOURCE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'ベッド横の画面' : 'スマホ・PC';
const two = (n) => String(n).padStart(2, '0');
const hm = (d) => d.getHours() + ':' + two(d.getMinutes());

function showErr(msg) { const e = $('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: SOURCE, ...body }) });
  const j = await r.json();
  if (!r.ok || !j.ok) throw new Error(j.error || '記録できませんでした');
  return j;
}
function clearTimers() { timers.forEach(clearInterval); timers.forEach(clearTimeout); timers = []; }

/* ---------- 表示 ---------- */
function startTime() {
  if (mode === 'open' && st.open) return new Date(new Date(st.open.ts).getTime() + startAdj * 60000);
  return new Date(Date.now() - startAdj * 60000);
}
function renderForm() {
  $('idle').classList.toggle('hidden', mode !== 'idle');
  $('form').classList.toggle('hidden', mode === 'idle');
  if (mode === 'idle') return;
  const t = startTime(), mins = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000));
  $('liveChip').classList.toggle('hidden', mode !== 'open');
  $('when').innerHTML = (mode === 'open' ? '開始 ' : 'あげ始め ') + hm(t) + ' <small>（' + (mins < 1 ? 'たった今' : mins + '分前') + '）</small>';
  $('milkV').textContent = vals.milk;
  $('breastV').textContent = vals.breast;
  const total = vals.milk + vals.breast;
  $('totalV').textContent = total;
  $('finishBtn').disabled = total <= 0;
  $('finishLabel').textContent = total <= 0 ? '量を入れてください' : (mode === 'open' ? 'あげ終わった・' + total + 'ml を記録' : total + 'ml を記録する');
  $('cancelBtn').textContent = mode === 'open' ? 'やめる' : '戻る';
}
function renderSide() {
  const last = st.last;
  $('ago').textContent = last ? last.ago_text.replace(/前$/, '') : '記録なし';
  $('lastline').textContent = last ? '前回 ' + last.time + '・' + last.amount + 'ml（ミルク' + last.milk + '・母乳' + last.breast + '）' : '';
  $('total').textContent = st.today_total;
  $('count').textContent = '（' + st.today_count + '回）';
  $('todaySplit').textContent = st.today_count ? 'ミルク ' + st.today_milk + 'ml ／ 母乳 ' + st.today_breast + 'ml' : '';
  $('recent').innerHTML = st.recent.map((r) => '<div><span>' + r.time + '</span><span><b>' + r.amount + 'ml</b> <small>ミ' + r.milk + '・母' + r.breast + '</small></span></div>').join('');
  const s = $('sync');
  if (!st.sync_enabled) { s.className = 'warn'; s.textContent = 'ラズパイ内に保存中（共有シートは未設定）'; }
  else if (st.pending > 0) { s.className = 'warn'; s.textContent = '共有シートへ未送信 ' + st.pending + '件（自動で再送します）'; }
  else { s.className = 'ok'; s.textContent = '共有シートと同期済み'; }
}
function apply(j) {
  st = j;
  if (j.config) cfg = j.config;
  // 授乳中の記録があれば、量を入れる画面に（ほかの端末で始めた場合も）
  if (st.open && mode !== 'later') {
    if (mode !== 'open') { mode = 'open'; startAdj = 0; edited = false; }
    if (!edited) { vals.milk = st.last ? st.open.suggest_milk : cfg.default_ml; vals.breast = st.open.suggest_breast; }
  } else if (!st.open && mode === 'open') { mode = 'idle'; }
  renderSide(); renderForm();
}
async function refresh() {
  try { const r = await fetch('/api/milk', { cache: 'no-store' }); apply(await r.json()); showErr(''); }
  catch (e) { showErr('見守りカメラと通信できません'); }
}

/* ---------- 操作 ---------- */
$('startBtn').onclick = async () => {
  try {
    const j = await post('/api/feed/start', {});
    apply(j);                              // そのまま量を入れる画面へ
    toast(j.record.time + ' に開始しました');
  } catch (e) { showErr(e.message); }
};
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3000); }
$('laterBtn').onclick = () => {
  mode = 'later'; startAdj = 20; edited = false;
  vals.milk = st.last ? st.last.milk : cfg.default_ml; vals.breast = st.last ? st.last.breast : 0;
  renderForm();
};
$('form').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const k = b.dataset.k, step = k === 'breast' ? (cfg.breast_step_ml || 5) : cfg.step_ml;
  const v = vals[k] + Number(b.dataset.d) * step;
  vals[k] = Math.max(0, Math.min(cfg.max_ml, v)); edited = true; renderForm();
});
// 開始時刻の修正：open は開始時刻そのものを前後、later は「何分前」を前後
$('tMinus').onclick = () => { startAdj += mode === 'open' ? -5 : 5; clampAdj(); renderForm(); };
$('tPlus').onclick = () => { startAdj += mode === 'open' ? 5 : -5; clampAdj(); renderForm(); };
function clampAdj() {
  if (mode === 'later') startAdj = Math.max(0, Math.min(600, startAdj));
  else if (st.open) {
    const maxFwd = Math.floor((Date.now() - new Date(st.open.ts).getTime()) / 60000);
    startAdj = Math.max(-600, Math.min(maxFwd, startAdj));
  }
}
$('cancelBtn').onclick = async () => {
  if (mode === 'later') { mode = st.open ? 'open' : 'idle'; renderForm(); return; }
  try { const j = await post('/api/feed/undo', { id: st.open.id }); mode = 'idle'; apply(j); }
  catch (e) { showErr(e.message); }
};
$('finishBtn').onclick = async () => {
  const btn = $('finishBtn'); btn.disabled = true;
  try {
    let j;
    if (mode === 'open') {
      const body = { id: st.open.id, milk: vals.milk, breast: vals.breast };
      if (startAdj) body.start = isoLocal(startTime());
      j = await post('/api/feed/finish', body);
    } else {
      j = await post('/api/feed/add', { milk: vals.milk, breast: vals.breast, minutes_ago: startAdj });
    }
    lastRec = j.record; mode = 'idle'; apply(j); showDone(j);
  } catch (e) { showErr(e.message); }
  finally { btn.disabled = false; }
};
function isoLocal(d) {
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-';
  return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + 'T' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':00' +
    sign + two(Math.floor(Math.abs(off) / 60)) + ':' + two(Math.abs(off) % 60);
}
function showDone(j) {
  const r = j.record;
  $('dtitle').textContent = r.amount + 'ml を記録しました';
  $('dsplit').textContent = 'ミルク ' + r.milk + 'ml ＋ 母乳 ' + r.breast + 'ml';
  $('dtime').textContent = r.time + '〜' + (r.end_time || '') + (r.duration_min != null ? '（' + r.duration_min + '分）' : '');
  const ds = $('dsync');
  if (!j.sync_enabled) { ds.style.background = 'var(--warn-bg)'; ds.style.color = 'var(--warn-ink)'; ds.textContent = 'ラズパイ内に保存しました'; }
  else { ds.style.background = 'var(--ok-bg)'; ds.style.color = 'var(--ok-ink)'; ds.textContent = '共有シートに送ります'; }
  $('done').classList.add('show');
  let left = cfg.undo_sec; const u = $('undo'); u.disabled = false;
  $('undoleft').textContent = 'あと ' + left + ' 秒';
  clearTimers();
  timers.push(setInterval(() => {
    left -= 1;
    if (left <= 0) { u.disabled = true; $('undoleft').textContent = ''; } else { $('undoleft').textContent = 'あと ' + left + ' 秒'; }
  }, 1000));
  timers.push(setTimeout(() => { location.href = '/'; }, Math.max(10, cfg.undo_sec + 2) * 1000));
}
$('undo').onclick = async () => {
  if (!lastRec) return;
  clearTimers();
  try {
    const j = await post('/api/feed/undo', { id: lastRec.id });
    if (j.record && j.record.undo === 'reopened') { mode = 'open'; startAdj = 0; }
    edited = true; vals = { milk: lastRec.milk, breast: lastRec.breast };   // 入れた量のまま「授乳中」に戻る
    apply(j);
  } catch (e) { showErr(e.message); }
  $('done').classList.remove('show'); lastRec = null;
};

function tick() { $('clock').textContent = hm(new Date()); if (st) renderForm(); }
tick(); setInterval(tick, 15000);
refresh(); setInterval(refresh, 30000);
</script>
