# =====================================================================
#  見守りカメラ 設定ファイル
#  ・よく調整する値はすべてここにあります。
#  ・[alert] と [detection] は、保存すると数秒で自動反映されます（再起動不要）。
#  ・[camera] と [web] を変えたときは再起動してください：
#      sudo systemctl restart baby-monitor
#  ・パスワードや通知先URLは secrets.toml に書きます（このファイルには書かない）。
#  ・各項目の詳しい説明は docs/tuning.md を見てください。
# =====================================================================

[alert]
# 顔をこの秒数「続けて」確認できたら見守りを開始する（アラートの準備完了）。
# 起動直後や寝かせる前など、まだ顔を確認していない間はアラートを送りません。
confirm_sec = 10

# 確認中に顔が一瞬消えても、この秒数以内なら「続けて見えている」とみなす。
# 検出のちらつきで確認カウントがリセットされるのを防ぎます。
dropout_tolerance_sec = 2

# 見守り開始後、顔がこの秒数続けて見えなくなったらアラートを送る。
absent_sec = 15

# アラート後も顔が見えないままなら、この間隔（秒）で再通知する。
repeat_sec = 120

# アラート後、顔がこの秒数続けて見えたら「復帰」とみなして通知する。
# 布団の柄などの一瞬の誤検出でアラートが解除されるのを防ぎます。
recover_sec = 3

# 見守り開始・再開から、この秒数たっても一度も顔を確認できないときに一度だけお知らせする。
# （最初からうつ伏せ・カメラの向きずれ等に気づくため）0 にすると無効。
waiting_notify_sec = 600

# 起動したらすぐ見守りを開始するか（false なら「一時停止」状態で起動）
armed_on_start = true

[detection]
# 顔検出の信頼度しきい値（0〜1）。
#   上げる → 誤検出が減る（布団やぬいぐるみに枠が出る場合）が、見逃しが増える
#   下げる → 見逃しが減るが、誤検出が増える
score_threshold = 0.6

# 横向き（90°回転）の顔も探す。真上から撮るなら true 推奨。
try_rotations = true

# 検出用に縮小する横幅（px）。小さいほど速いが、小さく映った顔を見逃しやすい。
detect_width = 640

[camera]
width = 1280
height = 720
# カメラの取り付け向き：0 / 90 / 180 / 270
rotate = 0

[web]
port = 8000
jpeg_quality = 80

[milk]
# ミルクの記録（docs/milk.md）。保存すると自動で反映されます。
# 画面を開いたときの量（前回の記録があれば、前回の量から始まります）
default_ml = 100
# ＋・−ボタン1回で変わる量
step_ml = 10
# 記録できる最大の量
max_ml = 300
# ワンタッチで選べる量
presets = [40, 60, 80, 100, 120, 160]
# 記録した直後に「取り消す」を押せる秒数
undo_sec = 10
