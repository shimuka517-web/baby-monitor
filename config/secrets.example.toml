# =====================================================================
#  通知先・パスワード（他人に見せないファイル）
#  このファイルを secrets.toml という名前でコピーして編集してください：
#      cp config/secrets.example.toml config/secrets.toml
#      chmod 600 config/secrets.toml
#  （scripts/install.sh を実行した場合は自動でコピーされます）
#  secrets.toml は .gitignore 済みなので GitHub には上がりません。
#  変更後は再起動が必要です：sudo systemctl restart baby-monitor
# =====================================================================

[discord]
# 通知用チャンネルのウェブフックURL（作り方は docs/notifications.md）。
# 使わないなら空のまま。
webhook_url = ""

[gmail]
# 送信元のGmailアドレスと「アプリパスワード」（16文字。通常のパスワードは不可）。
# 使わないなら空のまま。
user = ""
app_password = ""
# 送信先（複数可）
to = ["you@example.com"]

[web]
# ブラウザで映像を見るときのID/パスワード。空なら認証なし。
user = ""
password = ""

[sheets]
# ミルク記録を送る Google Apps Script のウェブアプリURL と合言葉（docs/milk.md）。
# 空のままなら、記録はラズパイ内（data/milk.db）にだけ保存されます。
gas_url = ""
token = ""

[switchbot]
# SwitchBot アプリ → プロフィール → 設定 → アプリバージョンを10回タップ → 開発者向けオプション
# 「トークン」と「クライアントシークレット」をコピー（docs/home.md）。人に見せないこと
token = ""
secret = ""
